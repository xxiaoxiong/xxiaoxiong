<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Nicholas Xiong — Agent 系统工程师 · 开源技术讲解者</title>
  <desc id="desc">构建可治理的 Agent 运行时，也把复杂源码讲成清晰、可复核、 能迁移到真实项目中的学习系统。</desc>
  <defs>
    <linearGradient id="heroBeam" x1="0" x2="1">
      <stop offset="0" stop-color="#3DE1FF" stop-opacity=".08"/>
      <stop offset=".52" stop-color="#3DE1FF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="heroWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DE1FF" stop-opacity=".07"/>
      <stop offset=".6" stop-color="#080B12" stop-opacity="0"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".07"/>
    </linearGradient>
    <filter id="heroGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="heroGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#182235" stroke-width="1"/>
    </pattern>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Noto Sans Mono CJK SC",monospace}
      .pulse{animation:heroPulse 3.8s ease-in-out infinite}
      .trace{animation:heroTrace 5.6s linear infinite}
      @keyframes heroPulse{0%,100%{opacity:.42}50%{opacity:1}}
      @keyframes heroTrace{0%{transform:translateY(-52px);opacity:0}18%,76%{opacity:1}100%{transform:translateY(230px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.pulse,.trace{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="480" rx="24" fill="#080B12"/>
  <rect width="1200" height="480" rx="24" fill="url(#heroGrid)" opacity=".62"/>
  <rect width="1200" height="480" rx="24" fill="url(#heroWash)"/>
  <rect x="42" y="38" width="1116" height="404" rx="18" fill="none" stroke="#182235"/>
  <g transform="translate(72 68)">
    <rect width="58" height="58" rx="14" fill="#0C111B" stroke="#3DE1FF" stroke-width="1.5"/>
    <path d="M14 43V15h7l17 18V15h7v28h-6L21 24v19z" fill="#E7EDF7"/>
    <circle cx="49" cy="9" r="3.8" fill="#80FFB2" class="pulse" filter="url(#heroGlow)"/>
  </g>
  <text x="150" y="88" fill="#8491A5" font-size="12" letter-spacing="2.2" class="mono">NICHOLAS XIONG / BUILD · EXPLAIN · MAP</text>
  <text x="150" y="116" fill="#3DE1FF" font-size="13" font-weight="650">Agent 系统工程师 · 开源技术讲解者</text>
  <text x="72" y="192" fill="#E7EDF7" font-size="41" font-weight="780" letter-spacing="1">做系统，也把源码讲清楚</text>
  <text x="72" y="238" fill="#E7EDF7" font-size="18.5">构建可治理的 Agent 运行时，也把复杂源码讲成清晰、</text>
  <text x="72" y="268" fill="#E7EDF7" font-size="18.5">可复核、 能迁移到真实项目中的学习系统。</text>
  <line x1="72" y1="304" x2="650" y2="304" stroke="url(#heroBeam)" stroke-width="1.5"/>
  <text x="72" y="338" fill="#8491A5" font-size="13.5">用公开项目证明能力，用源码证据支撑结论</text>
  <g transform="translate(72 382)">
    <circle cx="5" cy="-4" r="4.5" fill="#80FFB2" class="pulse"/>
    <text x="20" y="0" fill="#80FFB2" font-size="10.5" letter-spacing="1.8" class="mono">OPEN SOURCE · SOURCE VERIFIED</text>
  </g>
  <g>
    <line x1="742" y1="104" x2="742" y2="354" stroke="#182235" stroke-width="2"/>
    <circle cx="742" cy="104" r="4" fill="#3DE1FF" class="trace" filter="url(#heroGlow)"/>
    <g transform="translate(770 72)">
      <rect width="350" height="92" rx="16" fill="#0C111B" stroke="#3DE1FF" stroke-opacity=".48"/>
      <rect x="18" y="18" width="70" height="22" rx="11" fill="#111827" stroke="#182235"/>
      <circle cx="29" cy="29" r="3" fill="#3DE1FF"/>
      <text x="39" y="33" fill="#3DE1FF" font-size="9.5" letter-spacing="1.4" class="mono">BUILD</text>
      <text x="18" y="61" fill="#E7EDF7" font-size="15.5" font-weight="740">构建可信 Agent 系统</text>
      <text x="18" y="81" fill="#8491A5" font-size="10.8">可治理运行时、持久状态、受控工具与故障恢复</text>
    </g>
    <g transform="translate(770 188)">
      <rect width="350" height="92" rx="16" fill="#0C111B" stroke="#8B5CF6" stroke-opacity=".72"/>
      <rect x="18" y="18" width="70" height="22" rx="11" fill="#111827" stroke="#182235"/>
      <circle cx="29" cy="29" r="3" fill="#8B5CF6"/>
      <text x="39" y="33" fill="#8B5CF6" font-size="9.5" letter-spacing="1.4" class="mono">EXPLAIN</text>
      <text x="18" y="61" fill="#E7EDF7" font-size="15.5" font-weight="740">讲清复杂源码</text>
      <text x="18" y="81" fill="#8491A5" font-size="10.8">用架构优先的课程，把每个结论落回源码证据</text>
    </g>
    <g transform="translate(770 304)">
      <rect width="350" height="92" rx="16" fill="#0C111B" stroke="#80FFB2" stroke-opacity=".48"/>
      <rect x="18" y="18" width="70" height="22" rx="11" fill="#111827" stroke="#182235"/>
      <circle cx="29" cy="29" r="3" fill="#80FFB2"/>
      <text x="39" y="33" fill="#80FFB2" font-size="9.5" letter-spacing="1.4" class="mono">MAP</text>
      <text x="18" y="61" fill="#E7EDF7" font-size="15.5" font-weight="740">建立开源生态图谱</text>
      <text x="18" y="81" fill="#8491A5" font-size="10.8">用结构化数据生成可维护的双语开源研究产品</text>
    </g>
  </g>
</svg>
