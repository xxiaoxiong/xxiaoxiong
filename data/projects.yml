  - repository: xxiaoxiong/general-agent-frame
    title: General Agent Frame
    description: A stable, compact general-purpose agent runtime built on native DeepAgents capabilities.
    problem: General agent foundations often duplicate framework execution logic and accumulate unstable self-evolution features before the core task loop is reliable.
    architecture: FastAPI or CLI → TaskService and TaskRunner → DeepAgents create_deep_agent → workspace, memory, skills, permissions and SQLite.
    evidence:
      - FastAPI and CLI task interfaces
      - Multi-session threads, workspace files, memory and static skills
      - Sensitive-file denial and optional human approval
      - Explicitly reduced unstable streaming and self-evolution paths
