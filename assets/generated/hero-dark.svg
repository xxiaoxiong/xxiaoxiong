<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Nicholas Xiong — Agentic Systems Engineer</title>
  <desc id="desc">Midnight agent control system with a governed task graph.</desc>
  <defs>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#3DE1FF" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#3DE1FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#182235" stroke-width="1"/>
    </pattern>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .pulse{animation:pulse 3.6s ease-in-out infinite}
      .packet{animation:packet 5.5s linear infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes packet{0%{transform:translateX(-90px);opacity:0}15%,75%{opacity:1}100%{transform:translateX(380px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.pulse,.packet{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="#080B12"/>
  <rect width="1200" height="430" rx="22" fill="url(#grid)" opacity="0.72"/>
  <path d="M0 350 C240 310 380 420 620 360 S950 290 1200 350 V430 H0Z" fill="#3DE1FF" opacity="0.025"/>
  <rect x="44" y="38" width="1112" height="354" rx="16" fill="none" stroke="#182235"/>
  <g transform="translate(74 74)">
    <rect width="66" height="66" rx="14" fill="#0C111B" stroke="#3DE1FF" stroke-width="1.5"/>
    <path d="M16 49V17h7l20 22V17h8v32h-7L24 27v22z" fill="#E7EDF7"/>
    <circle cx="55" cy="11" r="4" fill="#80FFB2" class="pulse" filter="url(#glow)"/>
  </g>
  <text x="74" y="188" fill="#8491A5" font-size="14" letter-spacing="4" class="mono">NICHOLAS / AGENTIC SYSTEMS</text>
  <text x="74" y="242" fill="#E7EDF7" font-size="40" font-weight="760" letter-spacing="1">AGENTIC SYSTEMS ENGINEER</text>
  <text x="74" y="282" fill="#E7EDF7" font-size="20">I build governed multi-agent runtimes, local AI platforms,</text>
  <text x="74" y="312" fill="#E7EDF7" font-size="20">and production-grade knowledge systems.</text>
  <text x="74" y="356" fill="#3DE1FF" font-size="14" class="mono">MULTI-AGENT RUNTIME · AI INFRASTRUCTURE · RAG · OPEN SOURCE</text>
  <g>
    <line x1="900" y1="100" x2="1030" y2="175" stroke="url(#beam)" stroke-width="2"/>
    <line x1="1030" y1="175" x2="940" y2="260" stroke="url(#beam)" stroke-width="2"/>
    <line x1="940" y1="260" x2="820" y2="208" stroke="url(#beam)" stroke-width="2"/>
    <line x1="820" y1="208" x2="900" y2="100" stroke="url(#beam)" stroke-width="2"/>
    <line x1="900" y1="100" x2="940" y2="260" stroke="url(#beam)" stroke-width="2"/>
    <circle cx="850" cy="154" r="3.5" fill="#3DE1FF" class="packet" filter="url(#glow)"/>
    <g>
      <circle cx="900" cy="100" r="28" fill="#0C111B" stroke="#3DE1FF" stroke-width="1.5"/>
      <circle cx="900" cy="100" r="5" fill="#3DE1FF" opacity="0.9"/>
      <text x="900" y="145" fill="#8491A5" text-anchor="middle" font-size="10" letter-spacing="1.6" class="mono">PLAN</text>
    </g>
    <g>
      <circle cx="1030" cy="175" r="23" fill="#0C111B" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="1030" cy="175" r="5" fill="#3DE1FF" opacity="0.9"/>
      <text x="1030" y="220" fill="#8491A5" text-anchor="middle" font-size="10" letter-spacing="1.6" class="mono">RUN</text>
    </g>
    <g>
      <circle cx="940" cy="260" r="23" fill="#0C111B" stroke="#3DE1FF" stroke-width="1.5"/>
      <circle cx="940" cy="260" r="5" fill="#80FFB2" opacity="0.9"/>
      <text x="940" y="305" fill="#8491A5" text-anchor="middle" font-size="10" letter-spacing="1.6" class="mono">VERIFY</text>
    </g>
    <g>
      <circle cx="820" cy="208" r="23" fill="#0C111B" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="820" cy="208" r="5" fill="#3DE1FF" opacity="0.9"/>
      <text x="820" y="253" fill="#8491A5" text-anchor="middle" font-size="10" letter-spacing="1.6" class="mono">STATE</text>
    </g>
  </g>
  <g transform="translate(940 338)">
    <circle cx="0" cy="-4" r="5" fill="#80FFB2" class="pulse"/>
    <text x="15" y="0" fill="#80FFB2" font-size="12" letter-spacing="2" class="mono">SYSTEM ONLINE</text>
  </g>
</svg>
