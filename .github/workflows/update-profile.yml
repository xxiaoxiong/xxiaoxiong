name: Update Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh verified GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm fetch:github
      - name: Generate profile
        run: pnpm generate
      - name: Validate refreshed output
        run: pnpm validate
      - name: Commit changed evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md data/generated.json assets/generated
          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated assets"
          git push origin HEAD:main
