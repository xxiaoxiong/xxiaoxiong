<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Engineering architecture map</title>
  <desc id="desc">From problem framing through verifiable open-source delivery.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#182235" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3DE1FF"/>
    </marker>
    <style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
  </defs>
  <rect width="1200" height="380" rx="20" fill="#080B12"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)" opacity="0.6"/>
  <text x="40" y="43" fill="#E7EDF7" font-size="16" font-weight="700">ARCHITECTURE MAP</text>
  <text x="1160" y="43" fill="#8491A5" font-size="11" text-anchor="end" letter-spacing="1.5" class="mono">EVIDENCE BEFORE CLAIMS</text>
  <path d="M286 137H321M571 137H606M856 137H891M1041 188V215H145V287H182M428 287H463M713 287H748" fill="none" stroke="#3DE1FF" stroke-width="1.4" opacity="0.7" marker-end="url(#arrow)"/>
  <g transform="translate(40 86)">
      <rect width="246" height="102" rx="13" fill="#0C111B" stroke="#182235"/>
      <text x="18" y="28" fill="#3DE1FF" font-size="11" letter-spacing="2" class="mono">01</text>
      <text x="18" y="55" fill="#E7EDF7" font-size="15" font-weight="700">PROBLEM</text>
      <text x="18" y="79" fill="#8491A5" font-size="12">Frame the outcome</text>
    </g>
  <g transform="translate(325 86)">
      <rect width="246" height="102" rx="13" fill="#0C111B" stroke="#182235"/>
      <text x="18" y="28" fill="#3DE1FF" font-size="11" letter-spacing="2" class="mono">02</text>
      <text x="18" y="55" fill="#E7EDF7" font-size="15" font-weight="700">ARCHITECTURE</text>
      <text x="18" y="79" fill="#8491A5" font-size="12">Choose boundaries</text>
    </g>
  <g transform="translate(610 86)">
      <rect width="246" height="102" rx="13" fill="#0C111B" stroke="#182235"/>
      <text x="18" y="28" fill="#3DE1FF" font-size="11" letter-spacing="2" class="mono">03</text>
      <text x="18" y="55" fill="#E7EDF7" font-size="15" font-weight="700">AGENTS + TOOLS</text>
      <text x="18" y="79" fill="#8491A5" font-size="12">Govern execution</text>
    </g>
  <g transform="translate(895 86)">
      <rect width="246" height="102" rx="13" fill="#0C111B" stroke="#182235"/>
      <text x="18" y="28" fill="#3DE1FF" font-size="11" letter-spacing="2" class="mono">04</text>
      <text x="18" y="55" fill="#E7EDF7" font-size="15" font-weight="700">RUNTIME + STATE</text>
      <text x="18" y="79" fill="#8491A5" font-size="12">Persist ownership</text>
    </g>
  <g transform="translate(182 236)">
      <rect width="246" height="102" rx="13" fill="#0C111B" stroke="#182235"/>
      <text x="18" y="28" fill="#3DE1FF" font-size="11" letter-spacing="2" class="mono">05</text>
      <text x="18" y="55" fill="#E7EDF7" font-size="15" font-weight="700">VERIFY + EVAL</text>
