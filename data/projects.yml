  - repository: xxiaoxiong/learn-hermes-agent
    title: Learn Hermes Agent
    description: A structured teaching companion covering the 24 core mechanisms of Hermes Agent.
    problem: Hermes Agent's production architecture spans agent loops, tools, memory, skills, profiles, multi-agent coordination and durable delivery, which is difficult to learn directly from a large codebase.
    architecture: 24 progressive chapters → runnable minimal implementations → curated source explanations → current production architecture.
    evidence:
      - 24 chapters aligned with Hermes Agent v0.19.0
      - Runnable minimal implementations for the first six mechanisms
      - Coverage of memory, skills, security, profiles, multi-agent Kanban and durable delivery
      - Chinese and English learning paths
