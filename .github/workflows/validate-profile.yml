name: Validate Profile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Verify deterministic generation
        run: pnpm generate:check
      - name: Validate SVG
        run: pnpm validate:svg
      - name: Validate internal links
        run: pnpm validate:links
      - name: Reject generated drift
        run: git diff --exit-code
