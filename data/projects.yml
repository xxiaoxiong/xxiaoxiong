projects:
  - repository: xxiaoxiong/MegaDeepagents
    title: MegaDeepagents
    description: A governed, recoverable and observable multi-agent task runtime.
    problem: Multi-agent coding systems need durable ownership, controlled tools and verifiable completion instead of optimistic chat coordination.
    architecture: LangGraph root graph → TaskGraph/TaskBoard → parallel scheduler → DeepAgent workers → ArtifactStore → fail-closed Verifier → repair or replan.
    evidence:
      - Single runtime shared by browser, API and CLI
      - Versioned plan state and transactional execution state
      - Stable agent sessions, Git worktrees and governed integration
      - Python and frontend validation commands documented
    liveUrl: https://megadeepagents.vercel.app
    repositoryUrl: https://github.com/xxiaoxiong/MegaDeepagents
    technologies: [Python, FastAPI, LangGraph, DeepAgents, SQLite, Vue 3]
    priority: 4
    pinRecommendation: true
    originality: original
    readmeQuality: strong
    hasDemo: true
    hasTests: true
    hasCI: false
    license: License header declares MIT; root LICENSE was not detected
    issues:
      - Add a root LICENSE file
      - Add a visible CI workflow and status
    improvements:
      - Publish a short architecture demo with a verified run trace
      - Surface test scope and release history
