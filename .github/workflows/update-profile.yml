name: Update Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh verified GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm fetch:github
      - name: Generate profile
        run: pnpm generate
      - name: Validate refreshed output
        run: pnpm validate
      - name: Commit changed evidence
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No profile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md data/generated.json assets/generated
          git commit -m "chore(profile): refresh generated assets"
          git push
